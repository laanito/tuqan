services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-tuqan.ini
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/99-xdebug.ini
    environment:
      - APP_ENV=dev
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_TYPE=${DB_TYPE:-pgsql}
      - DB_NAME=${DB_NAME:-qnova}
      - DB_USER=${DB_USER:-qnova}
      - DB_PASS=${DB_PASS:-secret}
      - APP_LANG_ID=${APP_LANG_ID:-1}
      - APP_LANG_INITIAL=${APP_LANG_INITIAL:-castellano}
      - APP_BASE_PATH=${APP_BASE_PATH:-}
    depends_on:
      - db
    networks:
      - tuqan-net

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/tuqan.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - tuqan-net

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-qnova}
      - POSTGRES_USER=${DB_USER:-qnova}
      - POSTGRES_PASSWORD=${DB_PASS:-secret}
    volumes:
      - tuqan_pgdata:/var/lib/postgresql/data
    ports:
      - "54321:5432"
    networks:
      - tuqan-net

volumes:
  tuqan_pgdata:

networks:
  tuqan-net:
    driver: bridge